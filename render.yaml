services:
  - type: web
    name: bingo-neon
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DB_PATH
        value: /opt/render/project/src/data/bingo.db
    disk:
      name: bingo-db
      mountPath: /opt/render/project/src/data
      sizeGB: 1
